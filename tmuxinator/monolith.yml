name: monolith
root: ~/dev

# Sample config: https://github.com/tmuxinator/tmuxinator#create-a-project

# Runs on project start, always

windows:
  - scratch:
      root: "~/tmp"
      layout: even-vertical
      panes:
        - 
        -
  - mono:
      root: "~/dev/checkr"
      layout: even-vertical
      panes:
        - ls
        -
